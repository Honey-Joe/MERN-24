<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
        <script src="https://cdn.tailwindcss.com"></script>

</head>
<body>
    <div class="max-w-[100%]">
        <div class="w-[90%] mx-auto h-screen flex flex-col justify-center items-center gap-2">
            <h1 class="font-bold">Count</h1>
            <p id="count">0</p>
            <div class="flex gap-5">
                <button class="px-5 py-2 bg-green-500 rounded-lg" id="start">Start</button>
                <button class="px-5 py-2 bg-red-500 rounded-lg" id="stop">Stop</button>
                <button class="px-5 py-2 bg-blue-500 rounded-lg" id="time">Time</button>
            </div>
        </div>

    </div>    
</body>
<script>
    var count = document.getElementById("count")
    var startBtn = document.getElementById("start")
    var stopBtn = document.getElementById("stop");
    var timeBtn = document.getElementById("time");
    var setI;
    startBtn.addEventListener("click" , ()=>{
        setI = setInterval(()=>{
            count.textContent = parseInt(count.textContent) + 1;
        } , 1000)
    })
    stopBtn.addEventListener("click" , ()=>{
        clearInterval(setI);
    })

    timeBtn.addEventListener("click" , ()=>{
        setTimeout(()=>{
            alert("Overtime")
            clearInterval(setI);
        } , 5000);
    })
</script>
</html>
